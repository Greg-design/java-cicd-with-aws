name: Continuous Integration with Github Actions

on:
  push:
    branches:
      - main
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Login para o Dockerhub
    - name: Login to Docker Hub
 
      uses: docker/login-action@v4.6.0
      with:
        registry: # optional
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Set up JDK 19
      uses: actions/setup-java@v4
      with:
        java-version: '19'
        distribution: 'temurin'
        cache: maven

    # Aqui faz o build da aplicação
    - name: Build Application JAR
      working-directory: ./rest-with-spring-boot-and-java-erudio
      run: mvn clean package

    # Aqui faz a parte do docker compose
    - name: Docker compose Build
      run: docker compose build

    # Push que envio para o Docker Hub  as docker images
    - name: Push to Docker Hub Container Registry 
      run: |
        docker tag ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot-erudio:latest gregory797/rest-with-spring-boot-erudio:${{ github.run_id }}

        docker push ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot-erudio:${{ github.run_id }}
        docker push ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot-erudio:latest
